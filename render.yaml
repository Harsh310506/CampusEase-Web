services:
  # FastAPI Service - Face Recognition API
  - type: web
    name: campus-ease-face-api
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python face_recognition_api.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NO_ALBUMENTATIONS_UPDATE
        value: 1
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SIMILARITY_THRESHOLD
        value: 0.4
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 8000
      - key: USE_GPU
        value: False
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /health
    
  # Flask Service - Priority Prediction API
  - type: web
    name: campus-ease-priority-api
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FLASK_ENV
        value: production
    healthCheckPath: /health
